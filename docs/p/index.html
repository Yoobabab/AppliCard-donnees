<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passeport de carte · Shivr</title>
<meta name="description" content="Le passeport d'une carte à collectionner : photos datées, état et propriétaires successifs, sur Shivr.">
<meta property="og:title" content="Passeport de carte">
<meta property="og:description" content="Photos datées, état et historique d'une carte, vérifiables sur Shivr.">
<meta name="theme-color" content="#1d1f33">
<meta name="robots" content="noindex">
<style>
  :root {
    --fond: #14152a; --feuille: #22243d; --bord: rgba(255,255,255,.14);
    --texte: #f2f2f7; --doux: #a9abc3; --accent: #7aa2ff; --vert: #4cd28a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
  .tampon { display: inline-block; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; overflow-wrap: anywhere; }
  .sous-titre { color: var(--doux); margin: 0 0 18px; overflow-wrap: anywhere; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo { all: unset; cursor: zoom-in; display: block; }
  .photo img { width: 100%; aspect-ratio: 720 / 1006; object-fit: cover; border-radius: 10px; display: block; background: var(--feuille); }
  .photo span { display: block; text-align: center; color: var(--doux); font-size: 13px; margin-top: 4px; }
  .date-photos { text-align: center; color: var(--doux); font-size: 14px; margin: 8px 0 18px; }
  .fiche { background: var(--feuille); border-radius: 14px; padding: 12px 14px; border: 1px solid var(--bord); }
  .ligne { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; }
  .ligne span { color: var(--doux); }
  .ligne b { text-align: right; overflow-wrap: anywhere; }
  .ligne a { color: var(--accent); }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .evenement { border-left: 3px solid var(--accent); padding: 0 0 14px 12px; }
  .evenement time { color: var(--doux); font-size: 13px; display: block; }
  .evenement b { display: block; overflow-wrap: anywhere; }
  .evenement p { margin: 2px 0; color: var(--doux); font-size: 14px; overflow-wrap: anywhere; }
  .miniatures { display: flex; gap: 8px; margin-top: 6px; }
  .miniatures button { all: unset; cursor: zoom-in; }
  .miniatures img { width: 56px; aspect-ratio: 720 / 1006; object-fit: cover; border-radius: 4px; display: block; background: var(--feuille); }
  .avertissement { color: var(--doux); font-size: 13px; margin-top: 24px; }
  footer { margin-top: 30px; text-align: center; color: var(--doux); font-size: 14px; }
  footer strong { color: var(--texte); }
  .etat-chargement { text-align: center; color: var(--doux); padding: 60px 10px; }
  #loupe { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; cursor: zoom-out; }
  #loupe.ouverte { display: flex; }
  #loupe img { max-width: min(520px, 94vw); max-height: 90vh; border-radius: 12px; }
  .legal { font-size: 11px; margin-top: 10px; opacity: .7; }
</style>
</head>
<body>
<main>
  <div id="contenu" class="etat-chargement">Chargement du passeport…</div>
</main>
<div id="loupe" role="dialog" aria-modal="true" aria-label="Photo en grand"><img alt=""></div>
<script>
(() => {
  // Lecture d'un passeport dans la base Shivr (clé publique ; seul un passeport dont on a le lien est lisible).
  const URL_BASE = 'https://wjribvwoxehpqtatrffa.supabase.co';
  const CLE = 'sb_publishable_LvyFRDW4Y56BxRApAulAmw_gf5qG1Ur';
  const contenu = document.getElementById('contenu');
  const loupe = document.getElementById('loupe');
  const ETATS = { MT: 'Mint', NM: 'Near Mint', EX: 'Excellent', GD: 'Good', LP: 'Light Played', PL: 'Played', PO: 'Poor' };
  const LANGUES = { fr: 'Français', en: 'Anglais', ja: 'Japonais', de: 'Allemand', es: 'Espagnol', it: 'Italien' };
  const etat = (c) => (ETATS[c] ? `${ETATS[c]} (${c})` : String(c || ''));
  const photo = (chemin) => `${URL_BASE}/storage/v1/object/public/passeports/${encodeURI(chemin)}`;
  const date = (iso) => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const el = (tag, attrs = {}, enfants = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'texte') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const e of enfants) if (e) n.append(e);
    return n;
  };
  const texte = (x) => (typeof x === 'string' ? x : '');

  const id = new URLSearchParams(location.search).get('id');
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) { contenu.textContent = 'Ce lien de passeport est incomplet.'; return; }

  fetch(`${URL_BASE}/rest/v1/rpc/passeport_public`, {
    method: 'POST',
    headers: { apikey: CLE, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_id: id }),
  })
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((p) => {
      if (!p || typeof p !== 'object' || !p.carte) { contenu.textContent = "Ce passeport n'existe pas ou a été supprimé."; return; }
      afficher(p);
    })
    .catch(() => { contenu.textContent = 'Impossible de charger le passeport pour le moment. Réessayez dans un instant.'; });

  function agrandir(chemin) {
    loupe.querySelector('img').src = photo(chemin);
    loupe.classList.add('ouverte');
  }
  loupe.addEventListener('click', () => loupe.classList.remove('ouverte'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') loupe.classList.remove('ouverte'); });

  function libelle(e) {
    const qui = texte(e.pseudo) || 'Collectionneur';
    const avant = texte(e.pseudo_avant) || '?';
    if (e.type === 'creation') return `Passeport créé par ${qui}`;
    if (e.type === 'photos') return `Nouvelles photos par ${qui}`;
    if (e.type === 'echange') return `Passé de ${avant} à ${qui} (échange Shivr)`;
    return `Passé de ${avant} à ${qui}`;
  }

  function afficher(p) {
    const c = p.carte || {};
    const evenements = Array.isArray(p.evenements) ? p.evenements : [];
    document.title = `Passeport : ${texte(c.nom)} · Shivr`;
    let dernieres = null;
    for (const e of evenements) if (Array.isArray(e.photos) && e.photos.length >= 2) dernieres = e;
    const proprietaires = 1 + evenements.filter((e) => e.type === 'transfert' || e.type === 'echange').length;

    const certificat = texte(c.certificat).replace(/\D/g, '');
    let lienCert = null;
    if (certificat && /^PSA/.test(texte(c.gradation))) lienCert = `https://www.psacard.com/cert/${certificat}`;
    if (certificat && /^CGC/.test(texte(c.gradation))) lienCert = `https://www.cgccards.com/certlookup/${certificat}/`;

    const ligne = (titre, valeur) => el('div', { class: 'ligne' }, [el('span', { texte: titre }), valeur]);
    const details = [LANGUES[c.langue] || texte(c.langue), texte(c.extension), c.numero ? `n° ${texte(c.numero)}` : '', c.variante === 'holo' ? 'holo' : '', texte(c.gradation)]
      .filter(Boolean).join(' · ');

    contenu.className = '';
    contenu.replaceChildren(...[
      el('div', { class: 'tampon', texte: '🛂 Passeport de carte' }),
      el('h1', { texte: texte(c.nom) }),
      el('p', { class: 'sous-titre', texte: details }),
      dernieres ? el('div', { class: 'photos' }, dernieres.photos.slice(0, 2).map((ch, i) =>
        el('button', { class: 'photo', 'aria-label': i === 0 ? 'Agrandir le recto' : 'Agrandir le verso', onclick: () => agrandir(ch) }, [
          el('img', { src: photo(ch), alt: i === 0 ? 'Recto' : 'Verso' }),
          el('span', { texte: i === 0 ? 'Recto' : 'Verso' }),
        ]))) : null,
      dernieres ? el('p', { class: 'date-photos', texte: `Photos prises le ${date(dernieres.le)}` }) : null,
      el('div', { class: 'fiche' }, [
        ligne('État déclaré', el('b', { texte: etat(p.etat) })),
        ligne('Propriétaire actuel', el('b', { texte: texte(p.proprietaire) || 'Collectionneur' })),
        ligne('Propriétaires successifs', el('b', { texte: String(proprietaires) })),
        ligne('Passeport créé le', el('b', { texte: date(p.cree_le) })),
        certificat ? ligne('Certificat', lienCert ? el('a', { href: lienCert, target: '_blank', rel: 'noopener', texte: `${certificat} › vérifier` }) : el('b', { texte: certificat })) : null,
      ]),
      el('h2', { texte: 'Historique' }),
      ...[...evenements].reverse().map((e) => el('div', { class: 'evenement' }, [
        el('time', { texte: date(e.le) }),
        el('b', { texte: libelle(e) }),
        e.etat ? el('p', { texte: `État : ${etat(e.etat)}` }) : null,
        e.note ? el('p', { texte: `« ${texte(e.note)} »` }) : null,
        Array.isArray(e.photos) && e.photos.length ? el('div', { class: 'miniatures' }, e.photos.map((ch) =>
          el('button', { 'aria-label': 'Agrandir la photo', onclick: () => agrandir(ch) }, [el('img', { src: photo(ch), alt: '', loading: 'lazy' })]))) : null,
      ])),
      el('p', { class: 'avertissement', texte: 'Photos prises dans l’appli Shivr et datées par ses serveurs ; elles ne peuvent pas être modifiées après coup. L’état est déclaré par le propriétaire : Shivr ne vérifie pas l’authenticité de la carte. Comparez toujours les photos avec la carte reçue.' }),
      el('footer', {}, [
        el('div', {}, [document.createTextNode('Passeport créé avec '), el('strong', { texte: 'Shivr' }), document.createTextNode(', l’appli des collectionneurs de cartes.')]),
        el('div', { class: 'legal', texte: 'Pokémon et les noms associés sont des marques de Nintendo, Creatures et GAME FREAK ; ce site n’est ni affilié ni approuvé par The Pokémon Company.' }),
      ]),
    ].filter(Boolean));
  }
})();
</script>
</body>
</html>
