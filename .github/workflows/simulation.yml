name: Simulation reconnaissance
on:
  push:
    branches: [simulation-reel]
permissions:
  contents: write
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node outils/simulation.mjs 120 > simulation-resultat.txt 2>&1 || true
      - run: |
          git config user.name "sonde"; git config user.email "sonde@users.noreply.github.com"
          git add -A simulation-resultat.txt simulation; git commit -m "Résultat simulation [skip ci]"; git push
