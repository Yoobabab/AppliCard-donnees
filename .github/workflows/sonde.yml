name: Sonde
on:
  push:
    branches: [sonde]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node outils/debug.mjs > outils/resultat.txt 2>&1 || true
      - run: |
          git config user.name "sonde"; git config user.email "sonde@users.noreply.github.com"
          git add -A outils/resultat.txt essai; git commit -m "Résultat [skip ci]"; git push
