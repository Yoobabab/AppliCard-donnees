name: Sonde scellé
on: { push: { branches: [sonde-scelle] } }
permissions: { contents: write }
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node sonde/sonde.mjs
      - run: |
          git config user.name robot && git config user.email robot@users.noreply.github.com
          git add sonde && git commit -m "Résultat de la sonde" && git push
