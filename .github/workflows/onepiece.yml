# Relance seule du catalogue One Piece et de la veille de couverture, à la main.
name: One Piece et couverture seuls

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  onepiece:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One Piece
        run: SORTIE=. node outils/onepiece.mjs
      - name: Veille de couverture
        run: SORTIE=. node outils/couverture.mjs
      - name: Publier
        run: |
          git config user.name "robot-applicard"
          git config user.email "robot-applicard@users.noreply.github.com"
          git add v1/onepiece v1/manquantes.json rapport-onepiece.txt rapport-couverture.txt
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "One Piece du $(date -u +%Y-%m-%d)"
          git pull --rebase -q
          git push
