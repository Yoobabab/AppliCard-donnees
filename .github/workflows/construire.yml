# Chaque nuit, le robot met à jour les compléments de la base de cartes AppliCard
# (images, cotes et logos qui manquent dans TCGdex) et les publie dans ce dépôt.
name: Mise à jour des données

on:
  schedule:
    - cron: '17 3 * * *'   # tous les jours vers 5 h (heure de Paris)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['outils/**', 'package.json', '.github/workflows/construire.yml']

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: npm ci
      - name: Vérifier le calcul des empreintes
        run: node outils/test-empreinte.mjs 3819d0ee19cfc98e1278add87d45cd458777788aa97886899888a9988608
      - name: Construire les compléments et les empreintes
        run: SORTIE=. LIMITE_EMPREINTES=40000 node outils/construire.mjs
      - name: Publier
        run: |
          git config user.name "robot-applicard"
          git config user.email "robot-applicard@users.noreply.github.com"
          git add v1 etat rapport.txt
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Données du $(date -u +%Y-%m-%d)"
          git push
      - name: Historique des prix (branche « historique »)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 --branch historique "https://github.com/${GITHUB_REPOSITORY}.git" hist-ancien || mkdir -p hist-ancien
          node outils/historique.mjs hist-ancien hist
          cd hist
          git init -q -b historique
          git config user.name "robot-applicard"
          git config user.email "robot-applicard@users.noreply.github.com"
          git add -A
          git commit -qm "Historique des prix du $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" historique
