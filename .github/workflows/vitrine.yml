# Relance seule de la vitrine du Marché et du catalogue du scellé (sans tout le robot de nuit), à la main.
name: Vitrine et scellé seuls

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vitrine du Marché
        run: SORTIE=. node outils/vitrine.mjs
      - name: Catalogue du scellé
        run: SORTIE=. node outils/scelle.mjs
      - name: Publier
        run: |
          git config user.name "robot-applicard"
          git config user.email "robot-applicard@users.noreply.github.com"
          git add v1/vitrine.json v1/scelle.json etat/vitrine-cartes.json rapport-vitrine.txt rapport-scelle.txt
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Vitrine du $(date -u +%Y-%m-%d)"
          git pull --rebase -q
          git push
